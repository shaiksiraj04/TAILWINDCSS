<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Profile Card</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 flex items-center justify-center min-h-screen">
<div class="max-w-md mx-auto bg-white rounded-2xl shadow-sm border border-slate-200 p-6 sm:p-8">
  <h3 class="text-2xl font-bold text-slate-900">Get in touch</h3>
  <p class="mt-1 text-sm text-slate-500">We love to hear from you. Our team typically replies within 2 hours.</p>
  <form class="mt-6 space-y-4" onsubmit="event.preventDefault();">
    <div>
      <label class="block text-xs font-semibold uppercase tracking-wider text-slate-600 mb-1">Full Name</label>
      <input type="text" placeholder="John Doe" class="w-full px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-slate-900 placeholder-slate-400 focus:outline-none focus:border-indigo-500 focus:ring-4 focus:ring-indigo-50 transition-all text-sm">
    </div>
    <div>
      <label class="block text-xs font-semibold uppercase tracking-wider text-slate-600 mb-1">Email Address</label>
      <input type="email" placeholder="john@example.com" class="w-full px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-slate-900 placeholder-slate-400 focus:outline-none focus:border-indigo-500 focus:ring-4 focus:ring-indigo-50 transition-all text-sm">
    </div>
    <div>
      <label class="block text-xs font-semibold uppercase tracking-wider text-slate-600 mb-1">Message</label>
      <textarea rows="4" placeholder="How can we help you?" class="w-full px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-slate-900 placeholder-slate-400 focus:outline-none focus:border-indigo-500 focus:ring-4 focus:ring-indigo-50 transition-all text-sm resize-none"></textarea>
    </div>
    <button type="submit" class="w-full py-3 px-4 bg-indigo-600 hover:bg-indigo-700 text-white font-semibold rounded-xl shadow-sm transition-colors duration-200 text-sm focus:outline-none focus:ring-4 focus:ring-indigo-100">Send Message</button>
  </form>
</div>
