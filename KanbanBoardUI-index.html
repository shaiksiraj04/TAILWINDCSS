<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Profile Card</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 flex items-center justify-center min-h-screen">
<div class="w-full bg-slate-900 p-6 overflow-x-auto h-[550px] flex gap-5 items-start select-none">
  <!-- Kanban Task Status Segment Column -->
  <div class="w-80 bg-slate-800/60 rounded-xl border border-slate-700/50 p-4 flex flex-col shrink-0 max-h-full">
    <div class="flex justify-between items-center mb-3">
      <div class="flex items-center gap-2">
        <h5 class="text-sm font-bold text-white">In Progress Execution</h5>
        <span class="bg-slate-700 text-slate-300 text-[10px] font-bold px-2 py-0.5 rounded-full">2</span>
      </div>
    </div>
    <div class="space-y-3 overflow-y-auto pr-1">
      <div class="bg-slate-800 p-4 rounded-xl border border-slate-700/80 shadow-md cursor-grab active:cursor-grabbing hover:border-slate-500 transition-colors">
        <span class="bg-indigo-900/60 text-indigo-300 text-[10px] font-bold px-2 py-0.5 rounded-md uppercase">Feature Architecture</span>
        <h6 class="text-sm font-bold text-white mt-2">Integrate dynamic web layouts</h6>
        <p class="text-xs text-slate-400 line-clamp-2 mt-1 leading-relaxed">Map comprehensive testing matrices covering adaptive component behaviors during processing transitions.</p>
      </div>
    </div>
  </div>
</div>
