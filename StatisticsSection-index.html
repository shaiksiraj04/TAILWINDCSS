<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Profile Card</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 flex items-center justify-center min-h-screen">
<div class="max-w-5xl mx-auto bg-white border border-slate-200 rounded-2xl shadow-sm divide-y md:divide-y-0 md:divide-x divide-slate-200 grid grid-cols-1 md:grid-cols-3">
  <div class="p-6 sm:p-8 text-center">
    <p class="text-4xl font-extrabold text-indigo-600 tracking-tight">99.99%</p>
    <h4 class="mt-2 text-sm font-bold text-slate-800 uppercase tracking-wider">Platform Uptime</h4>
    <p class="mt-1 text-xs text-slate-500">Enterprise-grade SLAs active across all availability clusters.</p>
  </div>
  <div class="p-6 sm:p-8 text-center">
    <p class="text-4xl font-extrabold text-indigo-600 tracking-tight">4.8M+</p>
    <h4 class="mt-2 text-sm font-bold text-slate-800 uppercase tracking-wider">Daily Requests</h4>
    <p class="mt-1 text-xs text-slate-500">High-throughput requests processed with zero data degradation.</p>
  </div>
  <div class="p-6 sm:p-8 text-center">
    <p class="text-4xl font-extrabold text-indigo-600 tracking-tight">&lt;12ms</p>
    <h4 class="mt-2 text-sm font-bold text-slate-800 uppercase tracking-wider">Edge Latency</h4>
    <p class="mt-1 text-xs text-slate-500">Distributed multi-region routing delivering sub-millisecond responses.</p>
  </div>
</div>
