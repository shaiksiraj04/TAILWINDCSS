<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Profile Card</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 flex items-center justify-center min-h-screen">
<section class="max-w-4xl mx-auto bg-slate-900 rounded-3xl px-6 py-12 sm:px-12 sm:py-16 text-center shadow-xl relative overflow-hidden">
  <div class="absolute -top-24 -left-24 w-48 h-48 bg-indigo-600 rounded-full blur-3xl opacity-20"></div>
  <div class="absolute -bottom-24 -right-24 w-48 h-48 bg-emerald-500 rounded-full blur-3xl opacity-20"></div>
  <div class="relative z-10 max-w-2xl mx-auto">
    <h2 class="text-3xl sm:text-4xl font-extrabold tracking-tight text-white">Elevate your product delivery pipeline today</h2>
    <p class="mt-4 text-base text-slate-400 leading-relaxed">Join over 12,000 developers who deploy complex application architectures using our frictionless interface primitives.</p>
    <div class="mt-8 flex flex-col sm:flex-row justify-center gap-4">
      <button class="bg-indigo-600 hover:bg-indigo-500 text-white font-semibold py-3 px-6 rounded-xl text-sm transition-colors shadow-lg shadow-indigo-600/20">Start Free Trial</button>
      <button class="bg-slate-800 hover:bg-slate-700 text-slate-300 hover:text-white font-semibold py-3 px-6 rounded-xl text-sm transition-colors border border-slate-700">Schedule Demo</button>
    </div>
  </div>
</section>
