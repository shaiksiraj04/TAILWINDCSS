<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Profile Card</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 flex items-center justify-center min-h-screen">
<div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
  <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
    <article class="bg-white rounded-2xl overflow-hidden border border-slate-200 group shadow-sm hover:shadow-md transition-all duration-300">
      <div class="relative pt-[56.25%] overflow-hidden bg-slate-100">
        <img class="absolute inset-0 w-full h-full object-cover transition-transform duration-500 scale-100 group-hover:scale-105" src="https://images.unsplash.com/photo-1516321318423-f06f85e504b3?auto=format&fit=crop&w=600&q=80" alt="Data Analytics UI">
      </div>
      <div class="p-6">
        <time class="text-xs font-bold text-indigo-600 uppercase tracking-wider">Insights</time>
        <h3 class="mt-2 text-lg font-bold text-slate-900 line-clamp-2 leading-snug group-hover:text-indigo-600 transition-colors">Mastering Advanced Layout Systems in Modern Web Applications</h3>
        <p class="mt-2 text-sm text-slate-500 line-clamp-2 leading-relaxed">Learn how responsive layout strategies adapt cleanly to fluctuating user environments and asset pipelines.</p>
        <div class="mt-4 flex items-center gap-3">
          <img class="w-8 h-8 rounded-full" src="https://images.unsplash.com/photo-1472099645785-5658abf4ff4e?auto=format&fit=crop&w=80&q=80" alt="Alex Rivera">
          <span class="text-xs font-semibold text-slate-700">Alex Rivera &bull; 5 min read</span>
        </div>
      </div>
    </article>
  </div>
</div>
