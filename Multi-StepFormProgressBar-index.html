<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Profile Card</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 flex items-center justify-center min-h-screen">
<div class="max-w-xl mx-auto px-4 py-6">
  <div class="flex items-center relative">
    <div class="absolute left-0 right-0 top-1/2 -translate-y-1/2 h-1 bg-slate-200 z-0">
      <div class="w-1/2 h-full bg-indigo-600 transition-all duration-500"></div>
    </div>
    <div class="flex justify-between w-full relative z-10">
      <div class="text-center">
        <div class="w-9 h-9 bg-indigo-600 text-white rounded-full flex items-center justify-center text-sm font-bold shadow-sm ring-4 ring-white">1</div>
        <span class="absolute mt-2 transform -translate-x-1/3 text-xs font-bold text-slate-800 whitespace-nowrap">Profile Info</span>
      </div>
      <div class="text-center">
        <div class="w-9 h-9 bg-indigo-600 text-white rounded-full flex items-center justify-center text-sm font-bold shadow-sm ring-4 ring-white">2</div>
        <span class="absolute mt-2 transform -translate-x-1/3 text-xs font-bold text-slate-800 whitespace-nowrap">Verification</span>
      </div>
      <div class="text-center">
        <div class="w-9 h-9 bg-white border-2 border-slate-300 text-slate-400 rounded-full flex items-center justify-center text-sm font-bold shadow-sm ring-4 ring-white">3</div>
        <span class="absolute mt-2 transform -translate-x-1/3 text-xs font-semibold text-slate-400 whitespace-nowrap">Deployment</span>
      </div>
    </div>
  </div>
</div>
