<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Profile Card</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 flex items-center justify-center min-h-screen">
<div class="max-w-md mx-auto bg-white border border-slate-200 rounded-2xl shadow-sm p-5 space-y-5 animate-pulse">
  <div class="flex items-center gap-4">
    <div class="w-12 h-12 bg-slate-200 rounded-full shrink-0"></div>
    <div class="flex-1 space-y-2">
      <div class="h-4 bg-slate-200 rounded-md w-1/3"></div>
      <div class="h-3 bg-slate-200 rounded-md w-1/2"></div>
    </div>
  </div>
  <div class="space-y-2.5 border-t border-slate-100 pt-4">
    <div class="h-3.5 bg-slate-200 rounded-md w-full"></div>
    <div class="h-3.5 bg-slate-200 rounded-md w-full"></div>
    <div class="h-3.5 bg-slate-200 rounded-md w-4/5"></div>
  </div>
  <div class="h-36 bg-slate-200 rounded-xl w-full"></div>
  <div class="flex gap-2 justify-end">
    <div class="h-9 bg-slate-200 rounded-lg w-20"></div>
    <div class="h-9 bg-slate-200 rounded-lg w-24"></div>
  </div>
</div>
