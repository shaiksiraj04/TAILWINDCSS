<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Profile Card</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 flex items-center justify-center min-h-screen">
<section class="relative w-full min-h-screen flex items-center justify-center overflow-hidden bg-slate-950 px-4 py-20">
  <!-- Absolute Asset Video Stream Frame Positioning -->
  <video class="absolute inset-0 w-full h-full object-cover opacity-30 pointer-events-none z-0" autoplay loop muted playsinline>
    <source src="https://assets.mixkit.co/videos/preview/mixkit-abstract-laser-lights-background-32128-large.mp4" type="video/mp4">
  </video>

  <!-- Interactive Backdrop Blurred Glass Dashboard Card Component -->
  <div class="relative z-10 max-w-3xl w-full bg-white/[0.06] backdrop-blur-xl border border-white/10 rounded-3xl p-6 sm:p-12 text-center shadow-2xl">
    <span class="inline-flex items-center gap-1.5 px-3 py-1 bg-white/10 rounded-full text-xs font-bold text-white tracking-wide border border-white/10 uppercase">
      <span class="w-2 h-2 bg-indigo-400 rounded-full"></span> Architecture Horizon v4.0
    </span>
    <h1 class="mt-6 text-3xl sm:text-5xl font-black tracking-tight text-white leading-[1.15]">Next Generation Web Infrastructure Architecture</h1>
    <p class="mt-4 text-sm sm:text-base text-slate-300 max-w-xl mx-auto leading-relaxed">Execute continuous deployments, compute metrics transformations, and serve assets from distributed low-latency endpoints using zero physical operations servers.</p>
    <div class="mt-8 flex flex-col sm:flex-row justify-center gap-4">
      <button class="bg-white hover:bg-slate-100 text-slate-950 font-extrabold py-3.5 px-8 rounded-xl text-sm transition-transform hover:scale-[1.02] shadow-lg">Deploy Infrastructure Stack</button>
      <button class="bg-white/10 hover:bg-white/15 text-white font-bold py-3.5 px-8 rounded-xl text-sm border border-white/10 transition-colors backdrop-blur-md">Review Open Codebase</button>
    </div>
  </div>
</section>
