<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Profile Card</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 flex items-center justify-center min-h-screen">
<section class="max-w-4xl mx-auto bg-white rounded-2xl border border-slate-200 shadow-sm overflow-hidden grid grid-cols-1 md:grid-cols-12 items-center">
  <div class="md:col-span-5 bg-slate-50 relative min-h-[200px] md:h-full">
    <img class="absolute inset-0 w-full h-full object-cover" src="https://images.unsplash.com/photo-1557200134-90327ee9fafa?auto=format&fit=crop&w=500&q=80" alt="Newsletter Illustration">
  </div>
  <div class="md:col-span-7 p-6 sm:p-8 lg:p-10">
    <h4 class="text-xl sm:text-2xl font-black text-slate-900 tracking-tight">Stay synchronized with technology shifts</h4>
    <p class="mt-2 text-sm text-slate-500 leading-relaxed">Get carefully curated deep dives concerning web infrastructure optimization guidelines straight to your inbox weekly.</p>
    <form class="mt-6 flex flex-col sm:flex-row gap-2" onsubmit="event.preventDefault();">
      <div class="flex-1">
        <input type="email" placeholder="enter your working email" class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl text-slate-900 text-sm focus:outline-none focus:border-indigo-500 focus:ring-4 focus:ring-indigo-50 transition-all">
      </div>
      <button type="submit" class="bg-indigo-600 hover:bg-indigo-700 text-white text-sm font-bold py-3 px-5 rounded-xl transition-colors shadow-sm whitespace-nowrap">Subscribe Now</button>
    </form>
  </div>
</section>
