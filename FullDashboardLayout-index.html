<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Profile Card</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 flex items-center justify-center min-h-screen">
<div class="w-full h-screen bg-slate-50 overflow-hidden flex">
  <!-- Desktop Sidebar -->
  <aside class="hidden lg:flex flex-col w-64 bg-slate-900 text-white shrink-0">
    <div class="h-16 flex items-center px-6 border-b border-slate-800">
      <span class="text-lg font-black tracking-wider text-indigo-400">CORE.OS</span>
    </div>
    <nav class="flex-1 p-4 space-y-1 overflow-y-auto">
      <a href="#" class="flex items-center gap-3 px-3 py-2.5 bg-indigo-600 rounded-lg text-sm font-bold">Metrics Dashboard</a>
      <a href="#" class="flex items-center gap-3 px-3 py-2.5 text-slate-400 hover:text-white rounded-lg text-sm font-medium transition-colors">Infrastructure</a>
    </nav>
  </aside>

  <!-- Right Work Area -->
  <div class="flex-1 flex flex-col min-w-0 overflow-hidden">
    <!-- Top Bar -->
    <header class="h-16 bg-white border-b border-slate-200 flex items-center justify-between px-4 sm:px-6 z-20 shrink-0">
      <button class="lg:hidden p-2 text-slate-600 hover:bg-slate-100 rounded-lg" aria-label="Open sidebar">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h16"/></svg>
      </button>
      <div class="flex items-center gap-4 ml-auto">
        <span class="w-2.5 h-2.5 bg-emerald-500 rounded-full animate-ping"></span>
        <div class="h-8 w-px bg-slate-200"></div>
        <img class="w-8 h-8 rounded-full" src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=80&q=80" alt="User">
      </div>
    </header>

    <!-- Scrollable Workspace Inner Container -->
    <main class="flex-1 overflow-y-auto p-4 sm:p-6 focus:outline-none">
      <div class="max-w-7xl mx-auto space-y-6">
        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
          <div class="bg-white p-5 rounded-xl border border-slate-200 shadow-xs">
            <p class="text-xs font-bold text-slate-400 uppercase tracking-wider">Node Load</p>
            <p class="text-2xl font-black text-slate-800 mt-1">24.5%</p>
          </div>
          <div class="bg-white p-5 rounded-xl border border-slate-200 shadow-xs">
            <p class="text-xs font-bold text-slate-400 uppercase tracking-wider">Memory Allocation</p>
            <p class="text-2xl font-black text-slate-800 mt-1">4.2GB / 8GB</p>
          </div>
        </div>
        <div class="bg-white rounded-xl border border-slate-200 shadow-xs h-96 flex items-center justify-center text-slate-400 text-sm">
          [Analytical Visualization Mapping Interface]
        </div>
      </div>
    </main>
  </div>
</div>
