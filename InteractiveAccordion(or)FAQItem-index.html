<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Profile Card</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 flex items-center justify-center min-h-screen">
<div class="max-w-xl mx-auto space-y-3">
  <details class="group bg-white rounded-xl border border-slate-200 overflow-hidden shadow-sm" open>
    <summary class="flex justify-between items-center p-5 font-semibold text-slate-800 cursor-pointer hover:bg-slate-50/50 list-none select-none transition-colors">
      <span>What is your cancellation policy?</span>
      <span class="text-slate-400 group-open:rotate-180 transition-transform duration-300">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7"/></svg>
      </span>
    </summary>
    <div class="px-5 pb-5 border-t border-slate-100 pt-3 text-sm text-slate-500 leading-relaxed bg-slate-50/30">
      Our subscriptions are entirely contract-free. You can cancel your tier renewal directly from the account portal configurations at any point prior to your next scheduled processing statement.
    </div>
  </details>
</div>
