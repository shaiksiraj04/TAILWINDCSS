<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Profile Card</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 flex items-center justify-center min-h-screen">
<div class="max-w-xl mx-auto bg-slate-900 border border-slate-800 rounded-2xl shadow-2xl p-4 flex items-center gap-4 text-white">
  <img class="w-14 h-14 rounded-xl object-cover shrink-0 border border-slate-700" src="https://images.unsplash.com/photo-1614613535308-eb5fbd3d2c17?auto=format&fit=crop&w=120&q=80" alt="Album Cover">
  <div class="flex-1 min-w-0">
    <div class="flex justify-between items-baseline">
      <h5 class="text-sm font-bold truncate">Atmospheric Resonance System</h5>
      <span class="text-[10px] font-medium text-slate-400">1:42 / 3:40</span>
    </div>
    <p class="text-xs text-slate-400 truncate mt-0.5">Synthetic Overdrive Collective</p>
    <!-- Tracking Range Base Slider Bar -->
    <div class="w-full relative mt-3 h-1.5 bg-slate-700 rounded-full overflow-hidden cursor-pointer">
      <div class="absolute left-0 top-0 bottom-0 w-5/12 bg-indigo-500 rounded-full"></div>
    </div>
  </div>
  <div class="flex items-center gap-2 shrink-0">
    <button class="p-2 text-slate-400 hover:text-white transition-colors" aria-label="Previous track">
      <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 20 20"><path d="M8.445 14.834A1 1 0 0010 14V6a1 1 0 00-1.555-.832l-5 4a1 1 0 000 1.664l5 4zM14.445 14.834A1 1 0 0016 14V6a1 1 0 00-1.555-.832l-5 4a1 1 0 000 1.664l5 4z"/></svg>
    </button>
    <button class="p-2.5 bg-white text-slate-950 rounded-full hover:scale-105 transition-transform" aria-label="Play track">
      <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zM9.555 7.168A1 1 0 008 8v4a1 1 0 001.555.832l3-2a1 1 0 000-1.664l-3-2z" clip-rule="evenodd"/></svg>
    </button>
  </div>
</div>
