<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Profile Card</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 flex items-center justify-center min-h-screen">
<div class="max-w-7xl mx-auto px-4 py-6 grid grid-cols-1 lg:grid-cols-12 gap-8">
  <!-- Left Side Filter Parameter Column -->
  <aside class="hidden lg:block lg:col-span-3 space-y-6 bg-white p-5 border border-slate-200 rounded-xl h-fit">
    <div>
      <h5 class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-3">Categories</h5>
      <div class="space-y-2.5">
        <label class="flex items-center gap-2.5 text-sm font-semibold text-slate-700 cursor-pointer">
          <input type="checkbox" class="rounded border-slate-300 text-indigo-600 focus:ring-indigo-500 w-4 h-4" checked> Infrastructure
        </label>
      </div>
    </div>
    <hr class="border-slate-100">
    <div>
      <h5 class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-2">Cost Range Parameter</h5>
      <input type="range" min="0" max="500" value="250" class="w-full accent-indigo-600 cursor-pointer">
    </div>
  </aside>

  <!-- Right Side Adaptive Catalog Items Wrapper -->
  <main class="lg:col-span-9 space-y-4">
    <div class="flex justify-between items-center bg-white p-4 border border-slate-200 rounded-xl">
      <span class="text-xs font-bold text-slate-500">Showing 24 Assets available</span>
      <select class="text-xs font-bold text-slate-700 bg-slate-50 border border-slate-200 rounded-lg p-2 focus:outline-none focus:border-indigo-500">
        <option>Sort option: Top Rating</option>
      </select>
    </div>
    <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-4">
      <div class="bg-white border border-slate-200 rounded-xl p-4 shadow-2xs">
        <div class="w-full h-32 bg-slate-100 rounded-lg mb-3"></div>
        <h6 class="text-sm font-bold text-slate-900">Virtual Node Cluster Layer</h6>
        <p class="text-xs font-extrabold text-indigo-600 mt-1">$45.00 / mo</p>
      </div>
    </div>
  </main>
</div>
