<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Profile Card</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 flex items-center justify-center min-h-screen">
<div class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/60 backdrop-blur-sm">
  <div class="bg-white rounded-2xl shadow-xl max-w-3xl w-full overflow-hidden border border-slate-100 flex flex-col md:flex-row relative">
    <button class="absolute top-4 right-4 z-10 p-1.5 rounded-full bg-white/80 border border-slate-200 text-slate-500 hover:text-slate-800 transition-colors" aria-label="Close modal">
      <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/></svg>
    </button>
    <div class="w-full md:w-1/2 bg-slate-50 relative pt-[75%] md:pt-0 min-h-[300px]">
      <img class="absolute inset-0 w-full h-full object-cover" src="https://images.unsplash.com/photo-1505740420928-5e560c06d30e?auto=format&fit=crop&w=600&q=80" alt="Wireless Headphones">
    </div>
    <div class="w-full md:w-1/2 p-6 flex flex-col justify-between">
      <div>
        <span class="text-xs font-bold text-indigo-600 uppercase">Audio Essentials</span>
        <h3 class="text-xl font-extrabold text-slate-900 mt-1">SoundWave Studio Pro</h3>
        <p class="text-2xl font-black text-slate-800 mt-2">$249.00</p>
        <p class="text-sm text-slate-500 mt-3 leading-relaxed">Experience uncompromised acoustics featuring high-fidelity hybrid noise cancellation alongside responsive environmental audio filtering.</p>
        <div class="mt-4 flex gap-1.5">
          <button class="w-6 h-6 rounded-full bg-slate-800 ring-2 ring-offset-2 ring-slate-800" aria-label="Black color"></button>
          <button class="w-6 h-6 rounded-full bg-slate-300 ring-0 ring-offset-2 ring-slate-300" aria-label="Silver color"></button>
        </div>
      </div>
      <button class="mt-6 w-full py-3 bg-indigo-600 hover:bg-indigo-700 text-white font-semibold rounded-xl text-sm transition-colors shadow-sm">Add to Shopping bag</button>
    </div>
  </div>
</div>
