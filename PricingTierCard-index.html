<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Profile Card</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 flex items-center justify-center min-h-screen">
<div class="max-w-sm mx-auto bg-white rounded-2xl border-2 border-indigo-600 shadow-md p-6 relative">
  <span class="absolute top-0 right-6 transform -translate-y-1/2 bg-indigo-600 text-white text-xs font-bold px-3 py-1 rounded-full uppercase tracking-wider">Popular</span>
  <h4 class="text-lg font-bold text-slate-800">Pro Team</h4>
  <p class="text-sm text-slate-500 mt-1">For growing teams scaling production.</p>
  <div class="mt-4 flex items-baseline gap-1">
    <span class="text-4xl font-extrabold text-slate-900">$49</span>
    <span class="text-sm font-semibold text-slate-500">/ month</span>
  </div>
  <ul class="mt-6 space-y-3.5 border-t border-slate-100 pt-6">
    <li class="flex items-center gap-3 text-sm text-slate-600">
      <svg class="w-5 h-5 text-indigo-600 flex-shrink-0" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"/></svg>
      Up to 10 active projects
    </li>
    <li class="flex items-center gap-3 text-sm text-slate-600">
      <svg class="w-5 h-5 text-indigo-600 flex-shrink-0" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"/></svg>
      Advanced performance insights
    </li>
    <li class="flex items-center gap-3 text-sm text-slate-600">
      <svg class="w-5 h-5 text-indigo-600 flex-shrink-0" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"/></svg>
      Collaborative workspace tools
    </li>
    <li class="flex items-center gap-3 text-sm text-slate-600">
      <svg class="w-5 h-5 text-indigo-600 flex-shrink-0" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"/></svg>
      24/7 Priority support channel
    </li>
  </ul>
  <button class="mt-8 w-full py-3 px-4 bg-indigo-600 hover:bg-indigo-700 text-white font-semibold rounded-xl text-sm transition-colors shadow-sm shadow-indigo-100">Get Started</button>
</div>
